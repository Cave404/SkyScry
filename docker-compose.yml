services:
  skyscry:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skyscry
    restart: unless-stopped
    ports:
      - "8080:8080"
    devices:
      - "/dev/bus/usb:/dev/bus/usb"
    volumes:
      - "./data:/app/data"
      - "./config:/app/config"
    environment:
      - TZ=UTC

